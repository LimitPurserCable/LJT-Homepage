name: Verify Jekyll build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify personal content
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          for title in \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -F "$title" _site/index.html
            grep -F "$title" _site/publications/index.html
          done
          grep -F "jliugi@connect.ust.hk" _site/index.html
          grep -F "Vicent0205" _site/index.html
          grep -F "junteng88716710" _site/index.html
          grep -F "tbK9jl4AAAAJ" _site/index.html
          grep -F "Zhiyuan Honor Scholarship" _site/index.html
          grep -F "Research Intern" _site/index.html
          grep -F "MINIMAX" _site/index.html
          grep -F "Tencent WXG" _site/index.html
          grep -F "Shanghai AI Lab" _site/index.html
          echo "All personal content checks passed."
